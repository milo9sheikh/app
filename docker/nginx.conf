server {
  listen 80;
  # For HTTPS in production terminate TLS here (listen 443 ssl; ssl_certificate ...) and redirect 80 -> 443.
  location / {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/events {            # Server-Sent Events: no buffering, long timeout
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
