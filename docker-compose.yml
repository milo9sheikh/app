services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: attendance
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://attendance:${POSTGRES_PASSWORD}@postgres:5432/attendance
      PORT: "3000"
      TZ: UTC

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "src/worker.ts"]
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://attendance:${POSTGRES_PASSWORD}@postgres:5432/attendance
      TZ: UTC
    # The worker must be able to reach the routers on your LAN. If your routers are on a separate
    # network, use `network_mode: host` here instead.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]

volumes:
  pgdata:
